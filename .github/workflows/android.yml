# Baut bei jedem Push auf main Fasan Split und legt die APK unter Releases → „neueste“ ab (Vorlage: Fasan-Camera).
# Nur der FOSS-Weg: Flutter, Gradle, ONNX Runtime (MIT) aus Maven Central, keine Google-Dienste, kein FCM.
# Die Logs jedes Laufs landen im Branch `ci-logs`, damit sie ohne die Actions-Oberfläche lesbar sind.
name: Android-APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  # Erkennungs-Tor zuerst: ohne Bestehen keine APK (Nutzer 06.11.)
  erkennung:
    uses: ./.github/workflows/erkennung.yml
    secrets: inherit
  apk:
    needs: [erkennung]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 40   # change list for the in-app update (release notes)

      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Flutter festgenagelt wie bei der Kamera
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Modelle holen (Prüfsummen)
        working-directory: app
        run: |
          mkdir -p ../logs
          bash tool/fetch_models.sh 2>&1 | tee ../logs/modelle.log

      - name: Android-Projekt ergänzen
        working-directory: app
        run: |
          set -o pipefail
          flutter --version | tee ../logs/flutter.log
          flutter create --org app.fasan --project-name fasan_split --platforms android . 2>&1 | tee -a ../logs/flutter.log
          python3 tool/patch_android.py 2>&1 | tee -a ../logs/flutter.log

      - name: Analyse
        id: analyze
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ../logs/analyze.log

      - name: Tests
        id: tests
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../logs/test.log

      - name: Signaturschlüssel wählen
        id: key
        env:
          KEY_B64: ${{ secrets.FASAN_KEYSTORE_B64 }}
          KEY_PW: ${{ secrets.FASAN_KEYSTORE_PASSWORD }}
          # Übergang zum Release-Schlüssel abgeschlossen 04.11. (Sicherung auf dem Handy gespeichert). Für eine einmalige
          # Testversion hier FORCE_TEST_KEY: '1' setzen.
          FORCE_TEST_KEY: ''
        run: |
          mkdir -p logs
          ks=ci/fasan-split-test.p12; pw=fasan-split-test
          if [ "$FORCE_TEST_KEY" = 1 ]; then
            KEY_B64=""; echo "Übergang: Test-Schlüssel erzwungen (FORCE_TEST_KEY)" > logs/key.log
          fi
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PW" ]; then
            # Vom Handy eingefügt: Leerzeichen und Zeilenumbrüche entfernen, Passwort ohne Rand. Nie Inhalte ins Log.
            pwc=$(printf '%s' "$KEY_PW" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if ! printf '%s' "$KEY_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/fasan-release.p12" 2>/dev/null; then
              bad="Secret FASAN_KEYSTORE_B64 ist kein gültiges Base64 (nur den Inhalt der Datei FASAN_KEYSTORE_B64.txt einfügen)"
            elif ! keytool -list -keystore "$RUNNER_TEMP/fasan-release.p12" -storepass "$pwc" >/dev/null 2>&1; then
              bad="Release-Schlüssel lässt sich mit FASAN_KEYSTORE_PASSWORD nicht öffnen (Passwort oder Datei passt nicht)"
            fi
          fi
          if [ -n "${bad:-}" ]; then
            # Kaputtes Secret: weiter mit dem Testschlüssel, damit Updates auf die installierte Testversion weiter passen.
            echo "WARNUNG: $bad. APK mit Test-Schlüssel signiert." | tee logs/key.log
            echo "::warning::$bad"
          elif [ -n "$KEY_B64" ] && [ -n "$KEY_PW" ]; then
            ks="$RUNNER_TEMP/fasan-release.p12"; pw="$pwc"
            {
              echo "FASAN_KEYSTORE=$ks"
              echo "FASAN_KEYSTORE_PASSWORD=$pw"
              echo "FASAN_KEY_PASSWORD=$pw"
              echo "FASAN_KEY_ALIAS=fasan"
            } >> "$GITHUB_ENV"
            echo "Release-Schlüssel aktiv" | tee logs/key.log
          else
            echo "Test-Schlüssel ci/fasan-split-test.p12 (öffentlich, nur für Tests)" | tee -a logs/key.log
          fi
          # Fingerabdruck mitschreiben: muss bei jedem Lauf gleich sein und in fasan-app.github.io/.well-known/assetlinks.json stehen.
          keytool -list -v -keystore "$ks" -storepass "$pw" 2>/dev/null | grep 'SHA256:' | tee -a logs/key.log

      - name: APK bauen
        working-directory: app
        run: |
          set -o pipefail
          timeout 35m flutter build apk --release --target-platform android-arm64 \
            --build-name "0.1.${GITHUB_RUN_NUMBER}" --build-number "$((100 + GITHUB_RUN_NUMBER))" \
            --dart-define=FASAN_SHA="${GITHUB_SHA::7}" 2>&1 | tee ../logs/build.log
          cp build/app/outputs/flutter-apk/app-release.apk ../fasan-split.apk
          ls -la ../fasan-split.apk | tee -a ../logs/build.log

      - name: Signatur prüfen
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs fasan-split.apk | tee logs/signatur.log
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$aapt2" dump badging fasan-split.apk | grep -E "^package|^sdkVersion|^targetSdk|^application-label:" | tee -a logs/signatur.log

      # Wie bei der Kamera: veröffentlicht wird nur, wenn Analyse und Tests grün sind.
      - name: Release „neueste“ aktualisieren
        if: steps.analyze.outcome == 'success' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste -y --cleanup-tag || true
          # Change list for the app (lib/update.dart): one line per commit, „- <sha7> <subject>“, newest first.
          # The app shows the lines above its own build commit (FASAN_SHA).
          { echo "Testversion aus ${GITHUB_SHA::7}. Mit Test-Schlüssel signiert, solange kein Release-Schlüssel hinterlegt ist."; echo; \
            git log -30 --no-merges --pretty='- %h %s'; } > notes.md
          gh release create neueste fasan-split.apk --title "Fasan Split 0.1.${GITHUB_RUN_NUMBER} (Test)" \
            --notes-file notes.md \
            --prerelease --target "$GITHUB_SHA" 2>&1 | tee logs/release.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fasan-split-apk
          path: fasan-split.apk
          if-no-files-found: ignore

      - name: Logs in Branch ci-logs ablegen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/push-logs.sh "analyse=${{ steps.analyze.outcome }} tests=${{ steps.tests.outcome }} job=${{ job.status }}"

      - name: Rote Analyse oder Tests melden
        if: steps.analyze.outcome != 'success' || steps.tests.outcome != 'success'
        run: |
          echo "Analyse=${{ steps.analyze.outcome }} Tests=${{ steps.tests.outcome }}: keine Veröffentlichung."
          exit 1
