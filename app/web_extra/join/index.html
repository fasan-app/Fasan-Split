<!doctype html>
<!-- Fasan Split – invitation page. MPL-2.0
     The link is https://fasan-app.github.io/Fasan-Split/join/#<code>. The part after "#" never reaches the server.
     This page puts the code into sessionStorage (same tab only) and opens the app without the code in the address bar
     or the history; lib/web_platform_web.dart reads and removes it. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Fasan Split – Einladung</title>
<script>
  var c = location.hash.slice(1);
  var ok = true;
  try { if (c) sessionStorage.setItem('fasan-join', c); } catch (e) { ok = false; }
  // storage blocked (private window, in-app browser): hand the code over in the address; the app removes it at once
  location.replace(ok || !c ? '../' : '../#fasan-join=' + c);
</script>
</head>
<body>
<noscript>Fasan Split braucht JavaScript. / Fasan Split needs JavaScript.</noscript>
</body>
</html>
